resources:
  jobs:
    landing_to_bronze:
      name: "[${bundle.target}] rift-pulse-landing-bronze-silver"
      description: "Auto Loader ingestion followed by the MVP Bronze-to-Silver rebuild. Scheduled only by Airflow."
      max_concurrent_runs: 1
      timeout_seconds: 5400
      parameters:
        - name: bucket
          default: ${var.s3_bucket}
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: bronze_observations_table
          default: observations_raw
        - name: bronze_manifests_table
          default: recording_manifests_raw
        - name: orchestrator_run_id
          default: manual
        - name: orchestrator_logical_date
          default: manual
      tasks:
        - task_key: ingest_landing_to_bronze
          notebook_task:
            notebook_path: ../lakehouse/notebooks/01_landing_to_bronze.py
            source: WORKSPACE
          timeout_seconds: 4500
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: transform_bronze_to_silver
          depends_on:
            - task_key: ingest_landing_to_bronze
          notebook_task:
            notebook_path: ../lakehouse/notebooks/02_bronze_to_silver.py
            source: WORKSPACE
          timeout_seconds: 4500
          max_retries: 1
          min_retry_interval_millis: 60000
