version: 2

sources:
  - name: silver
    description: Validated, deduplicated match data produced by the PySpark Silver job.
    catalog: "{{ env_var('DATABRICKS_CATALOG', 'rift_pulse') }}"
    schema: silver
    tables:
      - name: matches
        description: One row per recording/session.
        config:
          loaded_at_field: coalesce(last_observed_at_utc, recorded_at_utc)
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: recording_id
            data_tests: [not_null, unique]
      - name: match_participants
        description: Final observed state of one participant in one recording.
        columns:
          - name: participant_key
            data_tests: [not_null, unique]
          - name: recording_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('silver', 'matches')
                    field: recording_id
          - name: team
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['BLUE', 'RED']
      - name: match_participant_items
        description: Final observed item slots for match participants.
        columns:
          - name: participant_key
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('silver', 'match_participants')
                    field: participant_key
          - name: recording_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('silver', 'matches')
                    field: recording_id
          - name: item_id
            data_tests: [not_null]
