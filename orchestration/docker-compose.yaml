name: rift-pulse-airflow

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: orchestration/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.5}
  image: rift-pulse-airflow:${AIRFLOW_VERSION:-2.10.5}
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Warsaw
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_CONN_DATABRICKS_DEFAULT: >-
      {"conn_type":"databricks","host":"${DATABRICKS_HOST}","login":"${DATABRICKS_CLIENT_ID}","password":"${DATABRICKS_CLIENT_SECRET}","extra":{"service_principal_oauth":true}}
    AIRFLOW_VAR_DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID}
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
    DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-rift_pulse}
    DATABRICKS_CLIENT_ID: ${DATABRICKS_CLIENT_ID}
    DATABRICKS_CLIENT_SECRET: ${DATABRICKS_CLIENT_SECRET}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ../dbt:/opt/airflow/dbt:ro
    - ./config/dbt/profiles.yml:/opt/airflow/.dbt/profiles.yml:ro
    - ./dbt-artifacts:/opt/airflow/dbt-target
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Warsaw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
